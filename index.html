<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="score-wrapper">
        <div class="score">
            <div class="chordarea">
                <div class="pitchline" data-freq="262" style="--pitchlevel: 0; --ghost: 0;">
                </div>
                <div class="harmonic-chy" style="--pitchlevel: 0; --dir: 1;">
                </div>
                <div class="harmonic-ly" style="--pitchlevel: 0; --dir: 1;">
                </div>
                <div class="harmonic-my" style="--pitchlevel: 0; --dir: 1;">
                </div>
                <div class="harmonic-zy" style="--pitchlevel: 0; --dir: 1;">
                </div>
                <div class="harmonic-gnay" style="--pitchlevel: 0; --dir: 1;">
                    <!--img src="assets/harmonic-gnay-line.png"-->
                </div>
                <div class="harmonic-octave" style="--pitchlevel: 0; --dir: 1;">
                </div>
        </div>
    </div>

    <!-- placeholder manual song maker -->
    <textarea id="phtextarea" style="font-family: monospace; width: 100%; height: 150px;" placeholder="placeholder processing system"></textarea>
    <!--
        sample songs:
        HARMONICS 1~16 
        [--.>][->][-2>][>][3>][2>][4>][+>]
        [22>][+3>][5>][+2>][6>][+4>][+23>][++><]
        YXENI ARPEGGIOS
        [> 2> b5>][> 2> b5>][{b}> 2> b5>][{bb}> 2> b5>]
        [{bbbb5}> 2> b5>][{bb}> 2> b5>][{bb}> 2> b5>]
        [{bbbb5}> 2> b5>][{bb5}> 2> 2e2>][{b}> 2> b5>]
        [> 2> b5>][{b}> 2> b5>][{bb}> 2> b5>][{bb5}> 2> b5>]
        [{bb5}> 2> 2e2> 2e22>][> 2> b5>]
        cu-kea-nu-vy
        [>][{-}22>][3>][{+}b>][3>][{-}22>][>]
    -->

    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.2">


    <button id="sample">play</button>

    <div class="infobox">! = <0 ah></div>


    
    
    <script src="scripts.js"></script>
</body>
</html>
